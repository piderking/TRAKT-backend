version: '3.8'

services:
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/trakt
      - PLUGIN_MOVIES_URL=http://plugin-movies:8000
      - PLUGIN_WAKATIME_URL=http://plugin-wakatime:8000
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-your_trakt_client_id}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-your_trakt_client_secret}
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trakt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  plugin-movies:
    build:
      context: ./plugins/movies
      dockerfile: Dockerfile
    ports:
      - "8001:8000"

  plugin-wakatime:
    build:
      context: ./plugins/wakatime
      dockerfile: Dockerfile
    ports:
      - "8002:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - gateway

volumes:
  pgdata:
